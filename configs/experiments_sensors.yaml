n_clients: 6

scenarios:
  iid:
    anomaly_fraction: [0.50, 0.50, 0.50, 0.50, 0.50, 0.50]
    required_band: [0.45, 0.55]
  non_iid:
    anomaly_fraction: [0.20, 0.30, 0.40, 0.60, 0.70, 0.80]
    reference_scenario: iid

federated:
  local_epochs: 5
  max_rounds: 200
  patience: 10
  min_delta: 0.0
  fraction_train: 1.0
  round_timeout_seconds: 3600
  fedprox_mu_grid: [0.001, 0.01, 0.1, 1.0]
  fedprox_selection_seed: 42

baselines:
  max_epochs: 1000
  patience: 50
  min_delta: 0.0

outputs:
  runs_dir: results/runs/sensors_only
  metrics_dir: results/metrics/sensors_only
  figures_dir: results/figures/sensors_only
